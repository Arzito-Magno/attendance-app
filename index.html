<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biometric Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="log-panel">
      <p class="brand">Access Console</p>
      <p class="brand-sub">Fingerprint + face verification</p>
      <div class="log" id="log"></div>
    </div>

    <div class="main">
      <div class="console">

        <div id="authView">
          <div class="tabs">
            <button class="tab active" id="tabLogin" onclick="setMode('login')">Log in</button>
            <button class="tab" id="tabRegister" onclick="setMode('register')">Register</button>
          </div>

          <div class="field" id="nameField" style="display:none;">
            <label>Full name</label>
            <input type="text" id="nameInput" placeholder="Jane Doe">
          </div>

          <div class="field">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="you@example.com">
          </div>

          <button class="primary-btn" id="primaryAction" onclick="onPrimaryAction()">Create account</button>

          <hr class="divider" id="scanDivider" style="display:none;">

          <div id="scanArea" style="display:none;">
            <div class="scan-row">
              <button class="scan-btn" id="fingerprintBtn" onclick="onFingerprint()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a7 7 0 0 0-7 7v2c0 3 1 5 2 6.5M12 3a7 7 0 0 1 7 7v3c0 1.2-.1 2.1-.3 3M9 20.5C7.6 18.7 7 16.7 7 14v-4a5 5 0 0 1 10 0v4c0 1-.1 1.8-.3 2.5M9.5 9.8v3.7c0 1.6.5 3 1.3 4.2M14.5 9.8v4c0 2.6-1 4.4-2 5.6"/></svg>
                <span id="fingerprintLabel">Fingerprint</span>
              </button>
              <button class="scan-btn" id="faceBtn" onclick="onFaceButton()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><circle cx="12" cy="12" r="2.2"/></svg>
                <span id="faceLabel">Face scan</span>
              </button>
            </div>

            <div class="camera-wrap" id="cameraWrap">
              <video id="video" autoplay muted playsinline></video>
              <div class="corner tl"></div><div class="corner tr"></div>
              <div class="corner bl"></div><div class="corner br"></div>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>
            <p class="hint" id="faceHint" style="display:none;">Look straight at the camera in good light, then click "Capture".</p>
            <button class="primary-btn" id="captureBtn" style="display:none;" onclick="onCapture()">Capture</button>
          </div>

          <p class="status" id="statusMsg"></p>
        </div>

        <div id="successView" class="success-screen" style="display:none;">
          <p class="brand-sub" style="margin-bottom:0;">Access granted</p>
          <p class="who" id="successName"></p>
          <p class="meta" id="successMeta"></p>
          <button class="primary-btn" style="margin-top:24px;" onclick="location.reload()">Sign out</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
